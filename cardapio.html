<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Cardápio da Casa Rios — cozinha brasileira contemporânea ao redor do fogo, em Pinheiros, São Paulo.">
<title>Cardápio — Casa Rios</title>
<link rel="icon" href="images/logo-casa-rios.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#191714;--cream:#f1eadc;--paper:#f7f2e8;--terra:#a94f36;--green:#24352b;--line:rgba(25,23,20,.18);--white:#fffaf0}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:contain}
.serif{font-family:'Playfair Display',serif;font-weight:400}

.nav{position:sticky;top:0;z-index:20;padding:18px 4vw;display:flex;align-items:center;justify-content:space-between;background:#171513;color:#fff}
.logo{display:block;line-height:0}
.logo img{height:44px;width:auto;object-fit:contain}
.back{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.back:hover{opacity:1}

.head{padding:80px 7vw 40px;text-align:center}
.kicker{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#806c57;margin-bottom:16px}
.title{font-size:clamp(42px,6vw,74px);line-height:.98;letter-spacing:-.035em;margin:0 0 18px}
.head p{max-width:520px;margin:0 auto;font-size:15px;line-height:1.8;color:#544d44}

.controls{position:sticky;top:80px;z-index:15;background:var(--paper);padding:16px 7vw;border-bottom:1px solid var(--line)}
.controls-bar{display:flex;gap:12px;align-items:center;max-width:900px;margin:0 auto}
.search{position:relative;flex:1}
.search input{width:100%;padding:14px 20px 14px 44px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-family:inherit;font-size:14px;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--terra)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.5}
.cats-toggle{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--white);padding:13px 20px;border-radius:999px;font-family:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);cursor:pointer;transition:.25s}
.cats-toggle:hover{border-color:var(--terra);color:var(--terra)}
.cats-toggle.open{background:var(--ink);border-color:var(--ink);color:#fff}
.cats-toggle svg{transition:transform .25s}
.cats-toggle.open svg{transform:rotate(180deg)}
.cats-toggle .cat-current{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cats{display:none;flex-wrap:wrap;gap:10px;justify-content:center;max-width:900px;margin:16px auto 0;padding-top:16px;border-top:1px solid var(--line)}
.cats.open{display:flex}
.cat-btn{border:1px solid var(--line);background:transparent;padding:9px 18px;border-radius:999px;font-family:inherit;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);cursor:pointer;transition:.25s}
.cat-btn:hover{border-color:var(--terra);color:var(--terra)}
.cat-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}

.menu-wrap{padding:50px 7vw 120px;max-width:1000px;margin:0 auto}
.group{margin-bottom:60px}
.group-title{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--terra);border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px}
.item{display:flex;justify-content:space-between;gap:20px;padding:24px 0;border-bottom:1px solid var(--line)}
.item-info{max-width:640px}
.item-name{font-family:'Playfair Display',serif;font-size:21px;margin:0 0 8px}
.item-desc{font-size:13px;line-height:1.7;color:#6b6255}
.item-price{font-family:'Playfair Display',serif;font-size:19px;white-space:nowrap;color:var(--terra)}
.empty{text-align:center;padding:60px 0;color:#8a8072;display:none}
.empty.show{display:block}

footer{background:#11100e;color:#e9e0d2;padding:40px 7vw;text-align:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8e8a82}

@media(max-width:800px){
  .nav{padding:16px 5vw}
  .logo img{height:38px}
  .head{padding:60px 5vw 30px}
  .controls{padding:16px 5vw;top:74px}
  .menu-wrap{padding:40px 5vw 90px}
  .item{flex-direction:column;gap:8px}
  .item-price{order:-1}
}
</style>
</head>

const wrap = document.getElementById('menuWrap');
const catButtons = document.getElementById('catButtons');
const searchInput = document.getElementById('searchInput');
const emptyState = document.getElementById('emptyState');
let activeCat = 'Todos';

function money(v){ return 'R$ ' + v.toFixed(2).replace('.', ',').replace(',00',''); }

function render(){
  const q = searchInput.value.trim().toLowerCase();
  wrap.innerHTML = '';
  let totalShown = 0;
  MENU.forEach(group => {
    if (activeCat !== 'Todos' && group.cat !== activeCat) return;
    const filtered = group.items.filter(it =>
      !q || it.name.toLowerCase().includes(q) || (it.desc && it.desc.toLowerCase().includes(q))
    );
    if (!filtered.length) return;
    totalShown += filtered.length;
    const section = document.createElement('div');
    section.className = 'group';
    section.innerHTML = `<div class="group-title">${group.cat}</div>` + filtered.map(it => `
      <div class="item">
        <div class="item-info">
          <p class="item-name serif">${it.name}</p>
          ${it.desc ? `<p class="item-desc">${it.desc}</p>` : ''}
        </div>
        <div class="item-price">${money(it.price)}</div>
      </div>
    `).join('');
    wrap.appendChild(section);
  });
  emptyState.classList.toggle('show', totalShown === 0);
}

const cats = ['Todos', ...MENU.map(g => g.cat)];
const catsToggle = document.getElementById('catsToggle');
const catCurrent = document.getElementById('catCurrent');

catButtons.innerHTML = cats.map(c => `<button class="cat-btn${c==='Todos'?' active':''}" data-cat="${c}">${c}</button>`).join('');
catButtons.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    catButtons.querySelector('.active')?.classList.remove('active');
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    catCurrent.textContent = activeCat === 'Todos' ? 'Categorias' : activeCat;
    render();
    closeCats();
  });
});

function openCats(){
  catButtons.classList.add('open');
  catsToggle.classList.add('open');
  catsToggle.setAttribute('aria-expanded', 'true');
}
function closeCats(){
  catButtons.classList.remove('open');
  catsToggle.classList.remove('open');
  catsToggle.setAttribute('aria-expanded', 'false');
}
catsToggle.addEventListener('click', () => {
  catButtons.classList.contains('open') ? closeCats() : openCats();
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.controls') ) closeCats();
});

searchInput.addEventListener('input', render);
render();
